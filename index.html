<!DOCTYPE html>
<html lang="en">
<head>

<body background="img/fondof.jpg">

            <hr><br><br> 

            <table bgcolor="white" border="8" bordercolor="black" width="0%">
                <tr>
                    <th>Vocabulary</th>
                </tr>

                <tr>
                    <td>
                        <select name="selecciona" size="1" id="varFV" onchange="FV()">

                        <option value="3">Pera</option>

                    </td>
                </tr>
            </table>
        </select>

            <br><a id="ref1"><img id="img" width="260" height="250" bordercolor="black"></a></br>

            <script type="text/javascript">

                {
                    var ins = document.getElementById("varFV").value;

                    
                    if (parseInt(ins)==0)
                    {
                        document.getElementById("img").src="img/imagen2.jpg";
